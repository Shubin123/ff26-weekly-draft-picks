name: Weekly draft board refresh

# Tuesdays 14:00 UTC, after Monday Night Football box scores land in nflverse.
on:
  schedule:
    - cron: "0 14 * * 2"
  workflow_dispatch:
    inputs:
      week:
        description: "Week to draft for (blank = next unplayed week)"
        required: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch Kaggle + nflverse data
        run: python scripts/fetch_data.py --season 2026
      - name: Pick target week
        id: wk
        run: |
          if [ -n "${{ github.event.inputs.week }}" ]; then echo "week=${{ github.event.inputs.week }}" >> "$GITHUB_OUTPUT"; exit 0; fi
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pandas as pd
          g = pd.read_csv("data/raw/nflverse/games.csv")
          g = g[(g.season == 2026) & (g.game_type == "REG")]
          print(f"week={int(g[g.home_score.isna()].week.min())}")
          PY
      - name: Run models, backtest and board
        run: |
          python scripts/kaggle_validation.py
          python run_pipeline.py --season 2026 --week ${{ steps.wk.outputs.week }}
          cp reports/kaggle_validation.json docs/data/
      - name: Commit refreshed board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data reports data/processed/*.csv
          git diff --cached --quiet || git commit -m "Weekly refresh: week ${{ steps.wk.outputs.week }}"
          git push
